[project]
name = "foldy-ai-agent"
version = "0.1.0"
description = "Manage your files biach"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "huggingface-hub>=1.12.0",
    "langchain-core>=1.3.2",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1.9",
    "llama-cpp-python[server]>=0.3.20",
    "loguru>=0.7.3",
    "openai>=2.32.0",
    "pydantic>=2.13.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.25.0",
    "uvicorn>=0.46.0",
]
[project.scripts]
foldy = "src.cli.main:app"